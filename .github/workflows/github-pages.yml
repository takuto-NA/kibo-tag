name: Build and Deploy

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  test-and-wasm-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Docker image
        run: docker build -t kibo-tag-dev .

      - name: Run tests
        run: docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace kibo-tag-dev make tests

      - name: Build WASM and run smoke detect
        run: docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace kibo-tag-dev make wasm-smoke

  build-and-deploy:
    needs: test-and-wasm-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Build Docker image
        run: docker build -t kibo-tag-dev .

      - name: Build WASM for Pages
        run: docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace kibo-tag-dev make apriltag_wasm.js

      - name: Deploy html
        uses: JamesIves/github-pages-deploy-action@4.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: html

      - name: Deploy docs
        uses: JamesIves/github-pages-deploy-action@4.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: docs/html
          target-folder: docs
