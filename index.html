<!DOCTYPE html>
<html>
<head>

    <meta charset="utf-8">
    <base target="_blank">

    <title>Apriltag Detector Example Canvas</title>

    <link href="//fonts.googleapis.com/css?family=Roboto:300,400,500,700" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="main.css">

</head>

<body>

<div id="container">

    <video id="webcam_canvas" playsinline autoplay style="display:none"></video>
    <canvas id="out_canvas"></canvas>
    Put up a tag from the selected family to see its detection.
    <fieldset id="detector_settings">
        <legend>Detector Settings</legend>
        <label for="detector_family">Tag family</label>
        <select id="detector_family">
            <option value="tag36h11" selected>tag36h11 (default AprilTag)</option>
            <option value="DICT_4X4_100">DICT_4X4_100 (OpenCV ArUco)</option>
        </select>
        <label for="detector_bits_corrected">Bits corrected</label>
        <select id="detector_bits_corrected">
            <option value="0">0</option>
            <option value="1" selected>1</option>
            <option value="2">2</option>
        </select>
        <label for="detector_tag_size_meters">Tag size (meters)</label>
        <input id="detector_tag_size_meters" type="number" min="0.01" step="0.01" value="0.15">
        <label for="detector_min_decision_margin">Minimum decision margin</label>
        <input id="detector_min_decision_margin" type="number" min="0" step="1" value="0">
        <p id="detector_status">Detector settings will apply when the WASM detector is ready.</p>
    </fieldset>
    <button id="req_save">Save next detection (local storage)</button>
    <p>Camera Parameters (valid json, as given by <a href="https://www.calibdb.net/">calibdb</a>):<br/>
     <textarea id="camera_info" rows="10" cols="100">
       {
            "camera_matrix": [
                [
                    939.3384407933022,
                    0,
                    640.347854307481
                ],
                [
                    0,
                    938.2560270381138,
                    340.7192620859387
                ],
                [
                    0,
                    0,
                    1
                ]
            ],
            "img_size": [
                1280,
                720
            ]
        }
     </textarea>
    </p>

    Saved detection:<br/>
    <canvas id="saved_det_canvas"></canvas>
    <textarea id="saved_det_data" rows="10" cols="100">No detection saved yet.</textarea>

</div>

<script src="main.js" async></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/7.1.0/math.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
<script type="module" src="video_process.js" async></script>

</body>
</html>
